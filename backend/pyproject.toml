[project]
name = "lazychat-backend"
version = "0.1.0"
description = "LazyChat agentic backend (Python)."
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.36",
    "aiosqlite>=0.20.0",
    "tenacity>=9.0.0",
    "orjson>=3.10.0",
    "sse-starlette>=2.1.3",
    "mcp>=1.1.0",
    "falkordb>=1.8.0",
    "greenlet>=3.5.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-asyncio>=0.24.0", "pytest-cov>=6.0.0", "ruff>=0.7.0", "mypy>=1.13.0"]

[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
