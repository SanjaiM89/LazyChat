<!DOCTYPE html>
<html data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <title>Hello HyperFrames</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script>
      window.__timelines = {};
      // Create a GSAP timeline for the composition
      const tl = gsap.timeline({ paused: true });
      tl.from("h1", { opacity: 0, duration: 0.5 })
        .from("p", { opacity: 0, duration: 0.5 }, "-=0.5")
        .to("h1", { opacity: 0, duration: 0.5 }, "+=1")
        .to("p", { opacity: 0, duration: 0.5 }, "-=0.5");
      window.__timelines['hello-world'] = tl;
    </script>
  </head>
  <body>
    <div id="root"
         data-composition-id="hello-world"
         data-width="1920"
         data-height="1080"
         data-start="0"
         data-duration="5">
      <h1 class="clip">Hello HyperFrames!</h1>
      <p class="clip">Motion Designing & Video Generation Made Easy</p>
    </div>
  </body>
</html>
